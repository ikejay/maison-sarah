<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maison Sarah | Order</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="container header-bar">
        <a class="brand" href="index.html">Maison Sarah</a>
        <nav aria-label="Primary navigation">
          <a href="index.html">Home</a>
          <a href="menu.html">Menu</a>
          <a href="order.html">Order</a>
        </nav>
      </div>
    </header>

    <main>
      <div class="container">
        <h1>Order Ahead</h1>
        <p>
          Please complete the form below to pre-order your favorites for pickup.
        </p>

        <form>
          <fieldset>
            <legend>Who is picking up</legend>
            <label class="field-block" for="name">Name</label>
            <input
              class="field"
              id="name"
              name="name"
              type="text"
              placeholder="Your name"
              required
            />

            <label class="field-block" for="email">Email</label>
            <input
              class="field"
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              required
            />
          </fieldset>

          <fieldset>
            <legend>Pickup day</legend>
            <div class="choice-row">
              <label class="choice">
                <input
                  type="radio"
                  name="pickup-day"
                  value="Saturday"
                  checked
                />
                Saturday
              </label>
              <label class="choice">
                <input type="radio" name="pickup-day" value="Sunday" />
                Sunday
              </label>
            </div>

            <label class="field-block" for="pickup-time">Pickup time</label>
            <select class="field" id="pickup-time" name="pickup-time">
              <option value="8:00">8:00 AM</option>
              <option value="9:00">9:00 AM</option>
              <option value="10:00">10:00 AM</option>
              <option value="11:00">11:00 AM</option>
            </select>
          </fieldset>

          <fieldset>
            <legend>Your order</legend>
            <div class="choice-row">
              <label class="choice">
                <input type="checkbox" name="order" value="Butter croissant" />
                Butter croissant
              </label>
              <label class="choice">
                <input type="checkbox" name="order" value="Almond twist" />
                Almond twist
              </label>
              <label class="choice">
                <input type="checkbox" name="order" value="Country sourdough" />
                Country sourdough
              </label>
              <label class="choice">
                <input type="checkbox" name="order" value="Berry tart" />
                Berry tart
              </label>
            </div>

            <label class="field-block" for="notes">Notes</label>
            <textarea
              class="field"
              id="notes"
              name="notes"
              rows="4"
              placeholder="Add any notes for your order"
            ></textarea>
          </fieldset>

          <button type="submit">Place pre-order</button>
        </form>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>© 2026 Maison Sarah</p>
      </div>
    </footer>
  </body>
</html>
